name: Build KraftDo Base Images

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
  schedule:
    # Rebuild automático semanal para actualizaciones de seguridad
    - cron: '0 2 * * 1'

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Base Image
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.OWNER }}/kraftdo-base
        tags: |
          # Tag basado en la rama (ej: develop)
          type=ref,event=branch
          # Tag 'latest' solo para la rama principal
          type=raw,value=latest,enable={{is_default_branch}}
          # Tag de la versión estable de PHP que estamos usando ahora
          type=raw,value=php8.4
          # Tag único por commit para trazabilidad
          type=sha,prefix={{branch}}-
    
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  security-scan:
    needs: build
    runs-on: ubuntu-latest
    name: Security Scan
    
    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        # Escanea la imagen específica que se acaba de construir (usando el primer tag generado)
        image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/kraftdo-base:${{ needs.build.outputs.image_tag }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'