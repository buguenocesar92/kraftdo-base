# =============================================================================
# EJEMPLO: docker-compose.yml usando kraftdo-base
# =============================================================================

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # O usar imagen pre-construida:
    # image: ghcr.io/buguenocesar92/kraftdo-base:latest
    ports:
      - "8080:80"
    environment:
      - APP_ENV=production
      - APP_KEY=base64:your-app-key-here
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_DATABASE=myapp
      - DB_USERNAME=user
      - DB_PASSWORD=password
      - REDIS_HOST=redis
    volumes:
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    depends_on:
      - db
      - redis
    networks:
      - app-network

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=myapp
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - app-network

volumes:
  app_storage:
  app_cache:
  db_data:
  redis_data:

networks:
  app-network:
    driver: bridge